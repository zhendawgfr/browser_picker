<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Browser Picker app icon: a mini picker listing three generic browser badges, one row chosen.
       Tile follows the macOS grid: 824x824 at (100,100), r=185. Regenerate the .icns with scripts/make-icon.sh. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8DEF"/><stop offset="1" stop-color="#2F5BD3"/></linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35D0BA"/><stop offset="1" stop-color="#1C8FA8"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC24B"/><stop offset="1" stop-color="#F0791F"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B07CF5"/><stop offset="1" stop-color="#6A3FD1"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1F5C" flood-opacity="0.35"/></filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  <!-- picker card -->
  <rect x="196" y="214" width="632" height="596" rx="72" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- row 1 -->
  <circle cx="318" cy="332" r="58" fill="url(#b1)"/>
  <circle cx="318" cy="332" r="30" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <rect x="406" y="314" width="300" height="36" rx="18" fill="#CBD3E1"/>
  <!-- row 2: chosen -->
  <rect x="226" y="436" width="572" height="152" rx="44" fill="#2F6BF0"/>
  <circle cx="318" cy="512" r="58" fill="url(#b2)" stroke="#FFFFFF" stroke-width="8"/>
  <ellipse cx="318" cy="512" rx="40" ry="18" transform="rotate(-28 318 512)" fill="none" stroke="#FFFFFF" stroke-width="11"/>
  <rect x="406" y="494" width="300" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- row 3 -->
  <circle cx="318" cy="692" r="58" fill="url(#b3)"/>
  <circle cx="318" cy="692" r="18" fill="#FFFFFF"/>
  <rect x="406" y="674" width="230" height="36" rx="18" fill="#CBD3E1"/>
</svg>
